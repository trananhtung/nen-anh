name: debug
on:
  push:
    branches: [debug-e2e]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45133449875 -n windows -D art
          Get-ChildItem art -Recurse -Filter '*.exe' | ForEach-Object { ./scripts/smoke.ps1 -Installer $_.FullName }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: smoke/*.png
          retention-days: 3
