name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
        shell: bash
      - uses: ilammy/setup-nasm@v1
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --locked -p nenanh-core --features simd
      - run: npm ci
      - run: npm test

      - name: Build installers
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi
          mkdir -p out
          npx tauri build --features simd -- --locked
          mv target/release/bundle/nsis/*-setup.exe "out/NenAnh-$version-setup.exe"
          npx tauri build --features simd --config src-tauri/tauri.offline.conf.json -- --locked
          mv target/release/bundle/nsis/*-setup.exe "out/NenAnh-$version-setup-offline.exe"
          (cd out && sha256sum *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Install, run, uninstall
        shell: pwsh
        run: |
          Get-ChildItem out/*.exe | ForEach-Object { ./scripts/smoke.ps1 -Installer $_.FullName }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows
          path: |
            out/*
            smoke/*.png
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: windows
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "Nén Ảnh $GITHUB_REF_NAME" --notes-file RELEASE.md --verify-tag
